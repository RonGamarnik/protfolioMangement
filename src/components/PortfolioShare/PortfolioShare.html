<section class="portfolio-share panel">
  <div class="panel-header">
    <div class="panel-title">
      <h2>Share Portfolio</h2>
      <p data-field="portfolio-name">Select who can view or edit this portfolio</p>
    </div>
    <button class="icon-button" type="button" data-action="close-portfolio-share" aria-label="Close">
      <i data-lucide="x"></i>
    </button>
  </div>

  <form class="portfolio-share__form" data-field="form">
    <label class="field">
      <span>User email</span>
      <input data-field="email" type="email" autocomplete="email" placeholder="name@example.com" required />
    </label>
    <label class="field">
      <span>Permission</span>
      <select data-field="permission">
        <option value="VIEW">View only</option>
        <option value="EDIT">Can edit</option>
      </select>
    </label>
    <button class="button button--secondary" type="submit">
      <i data-lucide="share-2"></i>
      Share
    </button>
  </form>

  <div class="portfolio-share__list" data-field="shares"></div>
</section>
