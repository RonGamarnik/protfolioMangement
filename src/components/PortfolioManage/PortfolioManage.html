<section class="portfolio-manage panel">
  <div class="panel-header">
    <div class="panel-title">
      <h2>Portfolio Management</h2>
      <p data-field="portfolio-subtitle">Manage the active portfolio</p>
    </div>
    <button class="icon-button" type="button" data-action="close-portfolio-manage" aria-label="Close">
      <i data-lucide="x"></i>
    </button>
  </div>

  <div class="portfolio-manage__body">
    <div class="portfolio-manage__identity">
      <span data-field="portfolio-role">Owner</span>
      <strong data-field="portfolio-name">Main Portfolio</strong>
      <small data-field="portfolio-meta">0 holdings</small>
    </div>

    <div class="portfolio-manage__actions">
      <button class="button button--danger" type="button" data-action="delete-active-portfolio">
        <i data-lucide="trash-2"></i>
        <span data-field="delete-label">Delete portfolio</span>
      </button>
    </div>
  </div>
</section>
